services:
  frontend:
    ports:
      - "80:80"  # This exposes nginx running on port 80 inside container to localhost:80
      - "3000:3000"  # Expose Vite dev server for hot reload
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}  # Dev override
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./frontend:/app  # For hot reload (e.g., npm run dev)
      - /app/node_modules  # To persist node_modules
      - /app/.output  # To persist build output
    command: /start-ssl.sh

  backend:
    build:
      args:
        INSTALL_DEV: "true"
    environment:
      - DOMAIN=localhost
    volumes:
      - ./backend:/app  # For hot reload (e.g., uvicorn --reload)

  db:
    ports:
      - "5433:5432"  # override to avoid clashing local PG
