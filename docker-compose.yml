services:
  nginx:
    container_name: nginx
    image: nginx:1.25-alpine
    ports:
      - "80:80" # Only Nginx binds to host port 80
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend

  # FRONTEND SERVICE
  frontend:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
    expose:
      - "80"

  # BACKEND SERVICE
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - db
    expose:
      - "8000"

  # POSTGRES SERVICE
  db:
    image: postgres:15
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
