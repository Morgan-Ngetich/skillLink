# HTTP: Redirect everything to HTTPS
server {
  listen 80;
  server_name frontend-production-a85f.up.railway.app;

  return 301 https://$host$request_uri;
}

# HTTPS: Serve content and proxy backend
server {
  listen 443 ssl http2;
  server_name frontend-production-a85f.up.railway.app;

  root /usr/share/nginx/html;
  index index.html;

  # Serve SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy exact /docs
  location = /docs {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/docs;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy /docs/ and below
  location /docs/ {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/docs/;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /openapi.json {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/openapi.json;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy all backend API calls
  location /api/ {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # # Optional: add security headers
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}
