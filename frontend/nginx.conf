server {
  listen 80;
  server_name https://frontend-production-a85f.up.railway.app;

  root /usr/share/nginx/html;
  index index.html;

  # This MUST be after the others
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy FastAPI Swagger UI and docs BEFORE the / block
  location /docs/ {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/docs/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /openapi.json {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy all backend API calls
  location /api/ {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
