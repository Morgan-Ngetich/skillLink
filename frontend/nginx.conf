server {
  listen 80;
  server_name frontend-production-a85f.up.railway.app;

  root /usr/share/nginx/html;
  index index.html;

  # Serve SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy exact /docs
  location = /docs {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/docs;
    proxy_ssl_verify off;
  }

  # Proxy /docs/ and children
  location /docs/ {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/docs/;
    proxy_ssl_verify off;
  }

  location /openapi.json {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1/openapi.json;
    proxy_ssl_verify off;
  }

  # Proxy backend API
  location /api/ {
    proxy_pass https://backend-production-3e33.up.railway.app/api/v1;
    proxy_ssl_verify off;
  }
}
