worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    # HTTP server (redirects to HTTPS)
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # HTTPS server
    server {
        listen 80;
        server_name _;

        # SSL certificates (self-signed)
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        
        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /usr/share/nginx/html;
        index index.html;


        # Method preservation for API routes
        location /api/ {
            # Use HTTPS directly to avoid redirects
            proxy_pass https://backend-production-3e33.up.railway.app;
            
            # Critical: Disable SSL verification for internal communication
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_server_name on;
            
            # Preserve Authorization header
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Preserve original request details
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            
            # Ensure request body is preserved
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            # Handle large request bodies
            client_max_body_size 10M;
            proxy_request_buffering off;
            
            # Add debug headers
            add_header X-Proxied-To https://backend-production-3e33.up.railway.app always;
            add_header X-Authorization-Present $http_authorization always;
        }

        # Health check endpoint
        location /health {
            proxy_pass https://backend-production-3e33.up.railway.app;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse off;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
            proxy_ssl_server_name on;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Debug endpoint
        location /debug-headers {
            add_header Content-Type text/plain;
            return 200 "Auth: $http_authorization\nMethod: $request_method\nHost: $host\nScheme: $scheme";
        }
    }
}