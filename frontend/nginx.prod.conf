worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Method preservation for API routes
        location /api/ {
            # USE HTTP (not HTTPS) to avoid SSL issues
            proxy_pass http://backend-production-3e33.up.railway.app;
            
            # ✅ CRITICAL: Preserve Authorization header
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ✅ Preserve original request details
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Host $host;
            
            # ✅ Ensure request body is preserved
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            # ✅ Handle redirects without losing headers
            proxy_redirect off;
            proxy_intercept_errors on;
            
            # ✅ Add debug headers to see what's being forwarded
            add_header X-Authorization-Sent $http_authorization always;
            add_header X-Proxied-To http://backend-production-3e33.up.railway.app always;
            
            # Handle large request bodies
            client_max_body_size 10M;
            proxy_request_buffering off;
        }

        # ✅ Simplified redirect handler that preserves headers
        location @handle_redirect {
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $proxy_host;
            return 307 $upstream_http_location;
        }

        # Health check endpoint for backend
        location /health {
            proxy_pass http://backend-production-3e33.up.railway.app;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header Authorization $http_authorization;
            access_log off;
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Debug endpoint to see what NGINX receives
        location /debug-headers {
            add_header Content-Type text/plain;
            return 200 "Auth Header: $http_authorization\nHost: $host\nMethod: $request_method";
        }
    }
}