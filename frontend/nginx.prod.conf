worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    # Upstream for Node.js SSR server
    upstream node_ssr {
        server localhost:3000;
        keepalive 32;
    }

    # HTTPS server
    server {
        listen 443 ssl;  # Changed to 443 for HTTPS
        server_name _;

        # SSL certificates (self-signed)
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        
        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /usr/share/nginx/html;
        index index.html;

        # Serve static assets directly from nginx
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Served-By "nginx";
            try_files $uri =404;
        }

        # API proxy
        location /api/ {
            proxy_pass https://backend-production-3e33.up.railway.app;
            
            # SSL configuration for backend
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_server_name on;
            
            # Headers
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            client_max_body_size 10M;
            proxy_request_buffering off;
            
            add_header X-Proxied-To https://backend-production-3e33.up.railway.app always;
        }

        # Health check for Node.js SSR server
        location /health {
            proxy_pass http://node_ssr;
            proxy_set_header Host $host;
            access_log off;
        }

        # Bot detection location
        location / {
            # Bot detection - send to Node.js SSR
            if ($http_user_agent ~* (bot|crawler|spider|crawling|facebookexternalhit|twitterbot|linkedinbot|slackbot|telegrambot|whatsapp|discordbot)) {
                return 302 /ssr-proxy$request_uri;
            }
            
            # SEO fragment requests
            if ($arg__escaped_fragment_ != "") {
                return 302 /ssr-proxy$request_uri;
            }

            # Regular users - serve static files from nginx
            add_header X-Served-By "nginx-static";
            try_files $uri $uri/ /index.html;
        }

        # SSR proxy location (handles all proxy headers in one place)
        location /ssr-proxy/ {
            internal;
            rewrite ^/ssr-proxy/(.*) /$1 break;
            
            proxy_pass http://node_ssr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Served-By "node-ssr";
        }

        # Debug endpoint
        location /debug-headers {
            add_header Content-Type text/plain;
            return 200 "Auth: $http_authorization\nMethod: $request_method\nHost: $host\nScheme: $scheme\nUser-Agent: $http_user_agent";
        }
    }

    # HTTP to HTTPS redirect (for any direct HTTP access)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}