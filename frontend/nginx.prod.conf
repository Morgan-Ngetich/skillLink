worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Method preservation for API routes
        location /api/ {
            # Use HTTP for internal communication
            proxy_pass http://backend-production-3e33.up.railway.app;
            
            # ✅ CRITICAL: Preserve Authorization header through redirects
            proxy_set_header Authorization $http_authorization;
            
            # ✅ Force the Host header to prevent redirects
            proxy_set_header Host backend-production-3e33.up.railway.app;
            
            # ✅ Standard headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ✅ Handle redirects without losing headers
            proxy_redirect http:// https://;
            proxy_intercept_errors on;
            
            # ✅ Use 307 redirects which preserve method
            error_page 301 302 = @handle_redirect;
            
            # ✅ Debug headers
            add_header X-Proxied-To http://backend-production-3e33.up.railway.app always;
            add_header X-Authorization-Present $http_authorization always;
        }

        # ✅ Redirect handler that preserves headers
        location @handle_redirect {
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            return 307 $upstream_http_location;
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Debug endpoint
        location /debug-headers {
            add_header Content-Type text/plain;
            return 200 "Auth: $http_authorization\nMethod: $request_method";
        }
    }
}