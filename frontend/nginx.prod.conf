worker_processes 1;

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /docs/ {
      proxy_pass https://backend-production-3e33.up.railway.app/api/v1/docs/;
      proxy_set_header Host backend-production-3e33.up.railway.app;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Add SSL settings for HTTPS backend
      proxy_ssl_verify off; # For testing, remove in production if you have valid certs
    }

    location /openapi.json {
      proxy_pass https://backend-production-3e33.up.railway.app/api/v1/openapi.json;
      proxy_set_header Host backend-production-3e33.up.railway.app;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      proxy_ssl_verify off;
    }

    location /api/ {
      # CORS preflight
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        return 204;
      }

      proxy_pass https://backend-production-3e33.up.railway.app/api/;
      proxy_set_header Host backend-production-3e33.up.railway.app;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      proxy_ssl_verify off;

      # CORS headers for actual requests
      add_header 'Access-Control-Allow-Origin' "$http_origin" always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}