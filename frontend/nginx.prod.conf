worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Method preservation for API routes
        location /api/ {
            # ✅ ADD PORT 8000 HERE
            proxy_pass http://backend-production-3e33.up.railway.app;
            
            # Critical: Preserve original request details
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Host $host;
            proxy_set_header X-Original-Remote-Addr $remote_addr;
            
            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Ensure request body is preserved
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            # Handle large request bodies
            client_max_body_size 10M;
            proxy_request_buffering off;
            
            # Debug headers
            add_header X-Proxied-To http://backend-production-3e33.up.railway.app always;
            add_header X-Original-Method-Debug $request_method always;
        }

        # Health check endpoint for backend
        location /health {
            proxy_pass http://backend-production-3e33.up.railway.app;
            proxy_set_header Host $host;
            access_log off;
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Debug endpoint to see what NGINX receives
        location /debug-request {
            add_header Content-Type text/plain;
            return 200 "Method: $request_method\nURI: $request_uri\nHost: $host\n";
        }
    }
}