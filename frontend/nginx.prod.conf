worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Method preservation for API routes
        location /api/ {
            # Use HTTP for internal communication
            proxy_pass http://backend-production-3e33.up.railway.app;
            
            # ✅ CRITICAL: Force headers through the entire proxy chain
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ✅ PRESERVE AUTHORIZATION HEADER (most important!)
            proxy_set_header Authorization $http_authorization;
            
            # ✅ Ensure these are also passed
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            # ✅ Prevent any redirect handling
            proxy_redirect off;
            proxy_next_upstream off;
            
            # ✅ Force backend to think it's a direct request
            proxy_set_header X-Original-Host $host;
            proxy_set_header X-Original-Method $request_method;
            
            # ✅ Debug headers to verify what's being sent
            add_header X-Debug-Auth-Sent $http_authorization always;
            add_header X-Debug-Backend http://backend-production-3e33.up.railway.app always;
        }

        # Debug endpoint to see what headers NGINX receives
        location /debug-headers {
            add_header Content-Type text/plain;
            return 200 "Auth-Received: $http_authorization\nMethod: $request_method";
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}