worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    # Main server - Railway handles HTTPS termination
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Method preservation for API routes
        location /api/ {
            proxy_pass https://backend-production-3e33.up.railway.app;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            client_max_body_size 10M;
            proxy_request_buffering off;
            
            add_header X-Proxied-To https://backend-production-3e33.up.railway.app always;
            add_header X-Authorization-Present $http_authorization always;
        }

        # Health check endpoint
        location /health {
            proxy_pass https://backend-production-3e33.up.railway.app;
            proxy_ssl_verify off;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Debug endpoint
        location /debug-headers {
            add_header Content-Type text/plain;
            return 200 "Auth: $http_authorization\nMethod: $request_method\nHost: $host\nScheme: $scheme";
        }
    }
}