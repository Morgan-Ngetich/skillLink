worker_processes 1;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Method preservation for API routes
        location /api/ {
            # Use HTTP for internal communication
            proxy_pass http://backend-production-3e33.up.railway.app;
            
            # ✅ CRITICAL: These headers prevent redirects
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ✅ Preserve Authorization header
            proxy_set_header Authorization $http_authorization;
            
            # ✅ Ensure request body is preserved
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            # ✅ Handle redirects properly
            proxy_redirect off;
            proxy_intercept_errors on;
            
            # ✅ Debug headers
            add_header X-Proxied-To http://backend-production-3e33.up.railway.app always;
            add_header X-Authorization-Present $http_authorization always;
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Debug endpoint to see headers
        location /debug-headers {
            add_header Content-Type text/plain;
            return 200 "Auth: $http_authorization\nMethod: $request_method\nBody: $request_body";
        }
    }
}