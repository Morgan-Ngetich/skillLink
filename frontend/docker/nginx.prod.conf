# nginx.prod.conf
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream for TanStack Start SSR server
    upstream tanstack_ssr {
        server localhost:8080;
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Main server block
    server {
        listen 80;
        listen 443 ssl http2;
        server_name _;

        # SSL certificates (self-signed for Railway, update for custom domain)
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        
        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static assets from TanStack Start build
        # Serve directly from nginx for better performance
        location /assets/ {
            alias /app/.output/public/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Served-By "nginx-static";
            
            # CORS for assets if needed
            add_header Access-Control-Allow-Origin "*";
            
            # Brotli/Gzip pre-compressed files
            gzip_static on;
            
            try_files $uri =404;
        }

        # Favicon and other public files
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            root /app/.output/public;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Served-By "nginx-static";
            try_files $uri =404;
        }

        # API proxy to backend
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass https://backend-production-3e33.up.railway.app;
            
            # SSL configuration for backend
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_server_name on;
            
            # Headers
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host backend-production-3e33.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            client_max_body_size 10M;
            proxy_request_buffering off;
            proxy_buffering off;
            
            add_header X-Proxied-To "railway-backend" always;
        }

        # Health check for TanStack Start SSR server
        location /health {
            proxy_pass http://tanstack_ssr/health;
            proxy_set_header Host $host;
            access_log off;
            
            # Quick timeout for health checks
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
        }

        # SEO-friendly bot detection and SSR handling
        # TanStack Start SSR handles everything, but we can optimize for bots
        location / {
            limit_req zone=general burst=20 nodelay;
            
            # All requests go through TanStack Start SSR
            proxy_pass http://tanstack_ssr;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Pass User-Agent for bot detection in app
            proxy_set_header User-Agent $http_user_agent;
            
            # Connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            add_header X-Served-By "tanstack-ssr" always;
        }

        # Debug endpoint (disable in production or protect with auth)
        location /debug-headers {
            # Uncomment to enable
            # add_header Content-Type text/plain;
            # return 200 "Auth: $http_authorization\nMethod: $request_method\nHost: $host\nScheme: $scheme\nUser-Agent: $http_user_agent";
            
            return 404;
        }

        # Custom error pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}