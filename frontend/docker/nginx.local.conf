# nginx.local.conf
worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging for local debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    # Upstream for TanStack Start dev server
    upstream tanstack_ssr {
        server localhost:3000;  # Use Docker service name instead of localhost
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase buffer sizes for dev mode
        client_body_buffer_size 1M;
        client_max_body_size 10M;

        # API endpoints - proxy to backend service
        location /api/ {
            proxy_pass http://backend:8000/api/;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Content-Type $content_type;
            
            # Timeouts for slow API calls during dev
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Disable buffering for real-time debugging
            proxy_buffering off;
            proxy_request_buffering off;
            
            add_header X-Proxied-To "backend-dev" always;
        }

        # Docs - proxy to backend
        location /docs {
            proxy_pass http://backend:8000/api/v1/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenAPI spec - proxy to backend
        location /openapi.json {
            proxy_pass http://backend:8000/api/v1/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check for TanStack Start
        location /health {
            proxy_pass http://tanstack_ssr;
            proxy_set_header Host $host;
            access_log off;
        }

        # Vite HMR WebSocket endpoint (crucial for hot reload)
        location /__vite_ping {
            proxy_pass http://tanstack_ssr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            access_log off;
        }

        # All other routes - TanStack Start with HMR support
        location / {
            proxy_pass http://tanstack_ssr;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket support for Vite HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Long timeouts for dev mode (debugging, breakpoints)
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            # Disable buffering for instant feedback
            proxy_buffering off;
            proxy_request_buffering off;
            
            add_header X-Served-By "tanstack-start-dev" always;
        }

        # Static assets - Let TanStack Start/Vite handle these in dev mode
        # They serve from memory with HMR, so nginx should not intercept
        location /assets/ {
            proxy_pass http://tanstack_ssr;
            proxy_set_header Host $host;
            
            # No caching in dev mode - always get fresh assets
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
        }

        # @vite client for HMR
        location /@vite/ {
            proxy_pass http://tanstack_ssr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            access_log off;
        }

        # node_modules serving (if needed for dev)
        location /node_modules/ {
            proxy_pass http://tanstack_ssr;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store";
        }
    }

    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}